<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Simulations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sim.css">
</head>
<body class="sim-page">
  <div class="app">
    <aside class="panel">
      <header class="brand">
        <h1>Simulations</h1>
        <a class="nav-link" href="index.html">← Graph plotter</a>
      </header>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" data-sim="fluid"><b>Fluid</b><small>Navier–Stokes</small></button>
        <button class="tab" role="tab" data-sim="em"><b>Light</b><small>Maxwell</small></button>
        <button class="tab" role="tab" data-sim="control"><b>Control</b><small>PID feedback</small></button>
        <button class="tab" role="tab" data-sim="fourier"><b>Fourier</b><small>series &amp; transform</small></button>
        <button class="tab" role="tab" data-sim="laplace"><b>Laplace</b><small>s-plane</small></button>
        <button class="tab" role="tab" data-sim="circuit"><b>Circuits</b><small>RLC &amp; ODEs</small></button>
        <button class="tab" role="tab" data-sim="learning"><b>Learning</b><small>optimization &amp; ML</small></button>
        <button class="tab" role="tab" data-sim="image"><b>Images</b><small>denoising</small></button>
        <button class="tab" role="tab" data-sim="linalg"><b>Linear algebra</b><small>matrices &amp; eigen</small></button>
        <button class="tab" role="tab" data-sim="prob"><b>Probability</b><small>Bayes, CLT, Markov</small></button>
        <button class="tab" role="tab" data-sim="conv"><b>Convolution</b><small>filters &amp; kernels</small></button>
        <button class="tab" role="tab" data-sim="tensor"><b>Tensors</b><small>n-d arrays &amp; loops</small></button>
      </nav>
      <div id="simPanel"></div>
    </aside>

    <main class="stage">
      <canvas id="sim"></canvas>
      <div id="hud" class="sim-hud"></div>
      <div id="stageHint" class="stage-hint"></div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="sim-ui.js"></script>
  <script src="sim-fluid.js"></script>
  <script src="sim-maxwell.js"></script>
  <script src="sim-control.js"></script>
  <script src="sim-fourier.js"></script>
  <script src="sim-laplace.js"></script>
  <script src="sim-circuit.js"></script>
  <script src="sim-learning.js"></script>
  <script src="sim-image.js"></script>
  <script src="sim-linalg.js"></script>
  <script src="sim-prob.js"></script>
  <script src="sim-conv.js"></script>
  <script src="sim-tensor.js"></script>
  <script src="sim.js"></script>
</body>
</html>
